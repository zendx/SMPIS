services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set the Supabase connection URL}
      SUPABASE_URL: ${SUPABASE_URL:?Set your Supabase URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set your server secret}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-school-documents}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Set the stable encryption key}
      APP_URL: ${APP_URL:?Set your HTTPS application URL}
      TRUST_PROXY_HOPS: 1
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PAYSTACK_SCHOOL_KEYS_JSON: ${PAYSTACK_SCHOOL_KEYS_JSON:-{}}
      PAYSTACK_LIVE_ENABLED: ${PAYSTACK_LIVE_ENABLED:-false}
    expose:
      - "3000"
    stop_grace_period: 60s
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
